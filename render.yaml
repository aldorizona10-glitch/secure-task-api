# One-click deploy on Render (free tier). Push to GitHub, then "New +" → Blueprint.
services:
  - type: web
    name: secure-task-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true      # Render generates a strong secret
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./securetask.db   # swap for a managed Postgres URL in prod
